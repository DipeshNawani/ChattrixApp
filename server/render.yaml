services:
  - type: web
    name: chattrix-server
    runtime: node
    plan: free
    rootDir: server
    region: singapore          # pick the region closest to your Supabase project
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false            # paste in the Render dashboard (secret)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
